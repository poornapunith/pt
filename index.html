<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POORNA TECH</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #f5e6d8, #e8c3a3);
  color: #4a2c1a;
}

.header {
  text-align: center;
  padding: 40px 20px 20px;
}

.logo {
  width: 100px;
  border-radius: 12px;
}

.title {
  font-size: 34px;
  font-weight: 700;
  margin-top: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 25px;
  padding: 20px;
}

.card {
  background: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(12px);
  border-radius: 18px;
  padding: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

.video-wrapper {
  position: relative;
  width: 100%;
  padding-top: 177.77%;
  border-radius: 12px;
  overflow: hidden;
}

.video-wrapper iframe {
  position: absolute;
  width: 100%;
  height: 100%;
  border: none;
}

button {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #c27b48, #a65f30);
  color: white;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="header">
  <img src="logo.png" class="logo">
  <div class="title">POORNA TECH</div>
</div>

<div class="grid" id="grid"></div>

<script>
async function loadVideos() {
  const res = await fetch('data.json');
  const data = await res.json();

  const grid = document.getElementById('grid');

  data.forEach((item) => {
    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <div class="video-wrapper">
        <iframe src="https://www.youtube.com/embed/${item.videoId}" allowfullscreen></iframe>
      </div>
      <button onclick="openDoc('${item.doc}')">Open Code</button>
    `;

    grid.appendChild(card);
  });
}

function openDoc(url) {
  window.open(url, '_blank'); // opens in new tab
}

loadVideos();
</script>

</body>
</html>
