<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>POORNA TECH</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #f5e6d8, #e8c3a3);
  color: #4a2c1a;
}

.header {
  text-align: center;
  padding: 40px 20px 20px;
}

.logo {
  width: 120px;
}

.title {
  font-size: 32px;
  font-weight: bold;
  margin-top: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 10px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

iframe {
  width: 100%;
  height: 460px;
  border-radius: 12px;
  border: none;
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  border-radius: 10px;
  background: #c27b48;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #a65f30;
}
</style>

</head>

<body>

<div class="header">
  <img src="logo.png" class="logo">
  <div class="title">POORNA TECH</div>
</div>

<div class="grid" id="grid"></div>

<script>
async function loadVideos() {
  const res = await fetch('data.json');
  const data = await res.json();

  const grid = document.getElementById('grid');

  data.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <iframe src="https://www.youtube.com/embed/${item.videoId}" allowfullscreen></iframe>
      <button onclick="copyText(${index}, this)">Copy</button>
    `;

    grid.appendChild(card);
  });

  window.videoData = data;
}

function copyText(index, btn) {
  const text = window.videoData[index].text;

  navigator.clipboard.writeText(text).then(() => {
    btn.innerText = "Copied!";
    setTimeout(() => btn.innerText = "Copy", 1500);
  });
}

loadVideos();
</script>

</body>
</html>
