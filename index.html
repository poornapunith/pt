<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shorts Grid</title>
<style>
body { background:#111; color:white; font-family:sans-serif; padding:20px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; }
.card { background:#1e1e1e; padding:10px; border-radius:10px; text-align:center; }
iframe { width:100%; height:450px; border:none; border-radius:10px; }
button { margin-top:10px; padding:8px 12px; background:red; color:white; border:none; border-radius:5px; cursor:pointer; }
</style>
</head>
<body>

<h2>Shorts</h2>
<div class="grid" id="grid"></div>

<script>
async function loadVideos() {
  const res = await fetch('data.json');
  const data = await res.json();

  const grid = document.getElementById('grid');

  data.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <iframe src="https://www.youtube.com/embed/${item.videoId}" allowfullscreen></iframe>
      <button onclick="copyText(${index}, this)">Copy</button>
    `;

    grid.appendChild(card);
  });

  window.videoData = data;
}

function copyText(index, btn) {
  const text = window.videoData[index].text;

  navigator.clipboard.writeText(text).then(() => {
    btn.innerText = "Copied!";
    setTimeout(() => btn.innerText = "Copy", 1500);
  });
}

loadVideos();
</script>

</body>
</html>
