<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Poorna Tech videos with direct prompt document links."
    />
    <title>Poorna Tech</title>
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://www.youtube-nocookie.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6570915843086049"
      crossorigin="anonymous">
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="Poorna Tech home">
        <img src="Logo.jpeg" alt="Poorna Tech logo" />
        <span>Poorna Tech</span>
      </a>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Poorna Tech</p>
          <h1 id="page-title">Videos & Prompts</h1>
        </div>
      </section>

      <section class="library-heading" aria-label="Video count">
        <h2>Latest Videos</h2>
        <p id="video-count">Loading videos...</p>
      </section>

      <section id="video-grid" class="video-grid" aria-live="polite"></section>

      <section id="empty-state" class="empty-state" hidden>
        <h2>Videos coming soon</h2>
        <p>New Poorna Tech videos and prompt links will appear here.</p>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; <span id="year"></span> Poorna Tech</p>
      <p>
        <a href="https://www.youtube.com/@poorna_tech" target="_blank" rel="noreferrer">YouTube</a>
        <a href="https://instagram.com/poorna_tech" target="_blank" rel="noreferrer">Instagram</a>
      </p>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
